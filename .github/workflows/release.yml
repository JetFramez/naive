name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # `npm stage` needs a CLI newer than what Node 22 bundles (it landed
      # in npm 11.15.0; Node 22 ships 10.x). Needed below regardless of
      # whether this run ends up staging anything.
      - run: npm install -g npm@latest

      # Versioning and changelogs only — deliberately no `publish` input.
      # NPM_TOKEN is a stage-only granular token: npm is retiring
      # direct-publish tokens (docs.npmjs.com/trusted-publishers), and
      # `changeset publish` always shells out to a plain `npm publish`,
      # which a stage-only token cannot do. changesets/changesets#2025
      # tracks native support for staged publishing; there isn't any yet,
      # hence the separate step below. This step only opens or updates the
      # "Version Packages" PR when changesets are pending.
      - name: Version packages
        id: changesets
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs on the push right after a "Version Packages" PR merges: no
      # changesets are pending anymore, and packages/notio/package.json
      # carries a version not yet on the registry. Stages it — NOT public
      # yet. A maintainer must run, locally:
      #   npm stage list                     (find the staged id)
      #   npm stage approve <id>              (requires 2FA — see README)
      # before the release is actually live. See README.md#releasing.
      - name: Stage the release
        if: steps.changesets.outputs.hasChangesets == 'false'
        working-directory: packages/notio
        run: |
          current=$(node -p "require('./package.json').version")
          published=$(npm view notio version 2>/dev/null || echo "none")
          if [ "$current" = "$published" ]; then
            echo "package.json version $current is already on the registry; nothing to stage"
          else
            echo "staging $current (registry currently has ${published:-nothing})"
            # `pnpm pack` resolves this package's catalog:/workspace: protocol
            # dependencies to real semver ranges. `npm stage publish` (like
            # plain `npm publish`) has no idea what those pnpm-specific
            # protocols mean and would stage a package.json with literal
            # "catalog:" strings as dependency versions — uninstallable by
            # anyone. Pack first, then stage that exact tarball, rather than
            # letting `npm stage publish` pack the raw (unresolved) directory
            # itself.
            pnpm pack --json > pack-output.json
            tarball=$(node -p "require('./pack-output.json').filename")
            npm stage publish "./$tarball"
            rm -f pack-output.json "$tarball"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
